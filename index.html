<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Board</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#fff;color:#000;font-family:"Noto Sans CJK SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
  #app{position:absolute;top:0;left:0;right:0;bottom:9vh;padding:2.5vh 5vw 0;overflow:hidden}
  .hdr{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #000;padding-bottom:1.2vh;height:11vh}
  .hdr .t{font-size:8vh;font-weight:700;line-height:1;letter-spacing:-0.02em}
  .hdr .d{font-size:2vh;text-align:right;line-height:1.5}
  .big-clock{font-size:30vw;font-weight:700;text-align:center;line-height:1.05;height:24vh;letter-spacing:-0.03em}
  @media (min-aspect-ratio:4/5){.big-clock{font-size:21vh}}
  .big-date{font-size:2.8vh;text-align:center;height:4.5vh}
  .wx{display:flex;justify-content:space-between;align-items:center;border:2px solid #000;height:13vh;padding:0 3vw}
  .wx .now{font-size:6.5vh;font-weight:700;line-height:1}
  .wx .desc{font-size:2.2vh;margin-top:0.6vh}
  .wx .days{display:flex}
  .wx .day{width:15vw;text-align:center;font-size:1.9vh;line-height:1.55;border-left:1px solid #000}
  .cal{margin-top:2vh;width:100%;border-collapse:collapse;font-size:2.4vh;text-align:center;table-layout:fixed}
  .cal th{font-weight:400;height:3.5vh;border-bottom:1px solid #000}
  .cal td{height:4.4vh}
  .cal td.today{background:#000;color:#fff;font-weight:700}
  .row{display:flex;align-items:center;height:8.2vh;border-bottom:1px solid #000}
  .row .no{width:7vw;font-size:3vh;font-weight:700}
  .row .n{flex:1;font-size:2.9vh;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .st{font-size:2.4vh;border:2px solid #000;padding:0.4vh 2vw;white-space:nowrap}
  .row .st.done{background:#000;color:#fff}
  .row .ar{width:5vw;text-align:right;font-size:2.6vh}
  .pager{display:flex;justify-content:space-between;align-items:center;height:7vh;font-size:2.4vh}
  .det .n{font-size:4.6vh;font-weight:700;margin-top:2.5vh;line-height:1.25}
  .det .st{display:inline-block;font-size:2.6vh;border:2px solid #000;padding:0.5vh 3vw;margin-top:1.5vh}
  .det .k{font-size:2vh;letter-spacing:0.15em;color:#555;margin-top:3.5vh}
  .det .v{font-size:3vh;line-height:1.5;margin-top:0.6vh}
  .lbl{font-size:2vh;letter-spacing:0.2em;margin-top:2vh}
  .case h2{font-size:3.8vh;line-height:1.3;margin:1vh 0}
  .case .p{font-size:2.2vh;color:#333}
  .case .sum{font-size:2.6vh;line-height:1.6;margin-top:1.5vh}
  .case ul{margin-top:1.5vh;padding-left:5vw;font-size:2.4vh;line-height:1.6}
  .case img{max-width:100%;max-height:30vh;margin-top:1vh;filter:grayscale(1)}
  .btn{display:inline-block;border:2px solid #000;padding:1vh 5vw;font-size:2.5vh;margin-top:2vh;margin-right:3vw}
  .photo{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:#fff}
  .photo img{max-width:100%;max-height:100%}
  .empty{font-size:2.8vh;text-align:center;margin-top:25vh;color:#555;line-height:1.6}
  #nav{position:absolute;left:0;right:0;bottom:0;height:9vh;display:flex;border-top:3px solid #000;background:#fff}
  #nav div{flex:1;display:flex;align-items:center;justify-content:center;font-size:2.6vh;border-left:1px solid #000}
  #nav div:first-child{border-left:0}
  #nav div.on{background:#000;color:#fff}
  @media (min-aspect-ratio:1/1){
    .cl{display:flex;align-items:flex-start}
    .cl .L{width:52%;padding-right:3vw}
    .cl .R{width:48%;padding-left:3vw;border-left:1px solid #000;height:84vh;display:flex;align-items:center}
    .big-clock{font-size:15vw;height:26vh;margin-top:4vh}
    .big-date{font-size:3.4vh;height:7vh}
    .wx{height:22vh;flex-direction:column;justify-content:center;align-items:stretch;padding:2vh 2vw}
    .wx .days{margin-top:1.5vh}
    .wx .day{width:auto;flex:1;font-size:2.4vh}
    .wx .day:first-child{border-left:0}
    .cal{font-size:3.2vh;margin-top:0}
    .cal th{height:6vh}
    .cal td{height:9vh}
    .row{height:9.5vh}
    .row .no{width:4vw}
    .row .ar{width:3vw}
    .det .n{margin-top:2vh}
    #nav div{font-size:3.2vh}
  }
  .tasks{margin-top:0.8vh}
  .trow{display:flex;justify-content:space-between;align-items:center;height:5.6vh;border-bottom:1px solid #999;font-size:2.5vh}
  .trow .tn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:2vw}
  .trow .st{font-size:2.1vh;border:1px solid #000;padding:0.2vh 1.6vw}
  .trow .st.done{background:#000;color:#fff}
  .row .cnt{font-size:2.1vh;font-weight:400;margin-left:2vw;color:#444}
  body.is-night #nav{display:none}
  body.is-night #app{bottom:0;padding:0}
  .night{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .night .nh,.night .nm{font-size:42vh;font-weight:700;line-height:0.95;letter-spacing:-0.04em}
  .night .nl{display:none;font-size:31vw;font-weight:700;line-height:1;letter-spacing:-0.04em}
  .night .nd{font-size:2.6vh;margin-top:2vh;color:#333}
  @media (min-aspect-ratio:1/1){
    .night .nh,.night .nm{display:none}
    .night .nl{display:block}
    .night .nd{font-size:3.4vh}
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="photos.js"></script>
<div id="nav">
  <div data-v="projects">项目</div>
  <div data-v="calendar">日历</div>
  <div data-v="photo">相框</div>
</div>
<script>
(function(){
  var LOCAL = location.protocol === 'file:';
  var REMOTE = 'https://longshu1224-hash.github.io/kd-board-7q4x/';
  var TZ_OFFSET = 8; // 新加坡 UTC+8，不依赖 Kindle 系统时区
  var LAT = 1.29, LON = 103.85;
  var IDLE_MS = 2 * 60 * 1000;
  var DATA = {projects:[],photos:[],case:null}, WX = null;
  var manual = null, manualAt = 0, caseOpen = false, photoIdx = 0;
  var qs = (location.search.match(/[?&]mode=(\w+)/) || [])[1];
  if (qs) { manual = qs; manualAt = Date.now() + 365*864e5; }

  function sg(){ var d = new Date(Date.now() + TZ_OFFSET*3600e3); return d; } // 用 UTC getter 读取
  function p2(n){ return (n<10?'0':'') + n; }
  var WD = ['日','一','二','三','四','五','六'];
  function hm(d){ return p2(d.getUTCHours()) + ':' + p2(d.getUTCMinutes()); }
  function ymd(d){ return d.getUTCFullYear() + '年' + (d.getUTCMonth()+1) + '月' + d.getUTCDate() + '日 星期' + WD[d.getUTCDay()]; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function wxText(c){
    if (c===0) return '晴'; if (c<=2) return '多云'; if (c===3) return '阴';
    if (c<=48) return '雾'; if (c<=57) return '毛毛雨'; if (c<=67) return '雨';
    if (c<=82) return '阵雨'; if (c>=95) return '雷雨'; return '—';
  }

  function auto(){
    var d = sg(), h = d.getUTCHours();
    if (h >= 23 || h < 7) return 'night';
    // 每 10 分钟一轮：项目 1 分钟（10%）→ 日历 4 分钟（40%）→ 相框 5 分钟（50%）
    var m = d.getUTCMinutes() % 10;
    var hasPhoto = DATA.photos && DATA.photos.length;
    if (m < 1) return 'projects';
    if (m < 5 || !hasPhoto) return 'calendar';
    return 'photo';
  }

  function current(){
    if (manual && Date.now() - manualAt < IDLE_MS) return manual;
    manual = null; caseOpen = false; projSel = -1; projPage = 0;
    return auto();
  }

  function header(title){
    var d = sg();
    var w = WX ? (Math.round(WX.current.temperature_2m) + '° ' + wxText(WX.current.weather_code)) : '';
    return '<div class="hdr"><div class="t">' + hm(d) + '</div><div class="d">' + esc(title||'') + '<br>' + ymd(d) + '<br>新加坡 ' + w + '</div></div>';
  }

  function vWeather(){
    if (!WX) return '<div class="wx"><div class="desc">天气加载中…</div></div>';
    var c = WX.current, dl = WX.daily, s = '<div class="wx"><div><div class="now">' + Math.round(c.temperature_2m) + '°</div><div class="desc">' + wxText(c.weather_code) + ' · 湿度 ' + c.relative_humidity_2m + '%</div></div><div class="days">';
    for (var i=0;i<3;i++){
      s += '<div class="day">' + (i===0?'今天':(i===1?'明天':'后天')) + '<br>' + wxText(dl.weather_code[i]) + '<br>' + Math.round(dl.temperature_2m_min[i]) + '–' + Math.round(dl.temperature_2m_max[i]) + '°<br>雨 ' + dl.precipitation_probability_max[i] + '%</div>';
    }
    return s + '</div></div>';
  }

  function vCalendar(){
    var d = sg(), y = d.getUTCFullYear(), m = d.getUTCMonth(), today = d.getUTCDate();
    var first = new Date(Date.UTC(y,m,1)).getUTCDay(), days = new Date(Date.UTC(y,m+1,0)).getUTCDate();
    var s = '<div class="cl"><div class="L"><div class="big-clock">' + hm(d) + '</div><div class="big-date">' + ymd(d) + '</div>' + vWeather() + '</div><div class="R">';
    s += '<table class="cal"><tr><th>日</th><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th></tr><tr>';
    for (var i=0;i<first;i++) s += '<td></td>';
    for (var k=1;k<=days;k++){
      s += '<td' + (k===today?' class="today"':'') + '>' + k + '</td>';
      if ((first+k)%7===0 && k<days) s += '</tr><tr>';
    }
    return s + '</tr></table></div></div>';
  }

  function tasksHtml(t){
    if (!t || !t.length) return '';
    var h = '<div class="k">分项进度</div><div class="tasks">';
    for (var i=0;i<t.length;i++){
      var st = t[i].status || '';
      h += '<div class="trow"><span class="tn">' + esc(t[i].name) + '</span><span class="st' + (st==='已完成'?' done':'') + '">' + esc(st) + '</span></div>';
    }
    return h + '</div>';
  }
  function taskCount(t){ if (!t || !t.length) return ''; var d=0; for (var i=0;i<t.length;i++) if (t[i].status==='已完成') d++; return d + '/' + t.length; }
  var PER_PAGE = (window.innerWidth > window.innerHeight) ? 7 : 8, projPage = 0, projSel = -1;
  function vProjects(){
    var L = DATA.projects || [];
    if (projSel >= 0 && L[projSel]) {
      var p = L[projSel];
      return header('项目详情') + '<div class="det"><div class="n">' + (projSel+1) + '. ' + esc(p.name) + '</div>' +
        '<div class="st">' + esc(p.status) + '</div>' +
        (p.stage ? '<div class="k">当前内容</div><div class="v">' + esc(p.stage) + '</div>' : '') +
        (p.next ? '<div class="k">下一步</div><div class="v">' + esc(p.next) + '</div>' : '') +
        (p.due ? '<div class="k">截止</div><div class="v">' + esc(p.due) + '</div>' : '') +
        tasksHtml(p.tasks) +
        '<div><span class="btn" id="projBack">‹ 返回列表</span></div></div>';
    }
    var s = header('进行中 ' + L.length + ' 个项目');
    if (!L.length) return s + '<div class="empty">目前没有待办项目</div>';
    var pages = Math.ceil(L.length / PER_PAGE); if (projPage >= pages) projPage = 0;
    for (var i = projPage*PER_PAGE; i < Math.min(L.length, (projPage+1)*PER_PAGE); i++){
      var q = L[i];
      s += '<div class="row" data-i="' + i + '"><div class="no" data-i="' + i + '">' + (i+1) + '</div><div class="n" data-i="' + i + '">' + esc(q.name) +
           (q.tasks && q.tasks.length ? '<span class="cnt">' + taskCount(q.tasks) + '</span>' : '') +
           '</div><div class="st' + (q.status==='已完成'?' done':'') + '" data-i="' + i + '">' + esc(q.status) + '</div><div class="ar" data-i="' + i + '">›</div></div>';
    }
    if (pages > 1) s += '<div class="pager"><span class="btn" id="pgPrev" style="margin:0">‹ 上一页</span><span>' + (projPage+1) + ' / ' + pages + '</span><span class="btn" id="pgNext" style="margin:0">下一页 ›</span></div>';
    return s;
  }

  function vCase(){
    var c = DATA.case;
    if (!c || !c.title) return header('今日案例') + '<div class="empty">今天的案例还没准备好</div>';
    var s = header('今日案例') + '<div class="case"><div class="lbl">TODAY · CASE</div><h2>' + esc(c.title) + '</h2>' +
            (c.place ? '<div class="p">' + esc(c.place) + '</div>' : '');
    if (c.image) s += '<img src="' + esc(c.image) + '" alt="">';
    s += '<div class="sum">' + esc(c.summary) + '</div>';
    if (caseOpen && c.details && c.details.length){
      s += '<ul>'; for (var i=0;i<c.details.length;i++) s += '<li>' + esc(c.details[i]) + '</li>'; s += '</ul>';
      if (c.source) s += '<div class="p" style="margin-top:3vw">来源：' + esc(c.source) + '</div>';
    }
    s += '<div><span class="btn" id="caseToggle">' + (caseOpen ? '收起' : '看详情') + '</span><span class="btn" id="caseClose">不感兴趣</span></div></div>';
    return s;
  }

  function vPhoto(){
    if (!DATA.photos || !DATA.photos.length) return header('相框') + '<div class="empty">还没有照片<br>把照片发给 Claude 就会出现在这里</div>';
    var ph = DATA.photos[photoIdx % DATA.photos.length];
    var src = typeof ph === 'string' ? ph : ph.src, cap = typeof ph === 'string' ? '' : (ph.caption || '');
    return '<div class="photo"><img src="' + esc(src) + '" alt="">' + (cap ? '<div class="cap">' + esc(cap) + '</div>' : '') + '</div>';
  }

  function vNight(){
    var d = sg(), H = p2(d.getUTCHours()), M = p2(d.getUTCMinutes());
    return '<div class="night"><div class="nh">' + H + '</div><div class="nm">' + M + '</div><div class="nl">' + H + ':' + M + '</div><div class="nd">' + ymd(d) + '</div></div>';
  }

  var lastHtml = '';
  function render(){
    var v = current(), html;
    if (v === 'projects') html = vProjects();
    else if (v === 'case') html = vCase();
    else if (v === 'photo') html = vPhoto();
    else if (v === 'night') html = vNight();
    else html = vCalendar();
    if (html !== lastHtml) { document.getElementById('app').innerHTML = html; lastHtml = html; }
    document.body.className = (v === 'night') ? 'is-night' : '';
    var tabs = document.getElementById('nav').getElementsByTagName('div');
    for (var i=0;i<tabs.length;i++) tabs[i].className = tabs[i].getAttribute('data-v') === v ? 'on' : '';
    var t = document.getElementById('caseToggle'), x = document.getElementById('caseClose');
    if (t) t.onclick = function(){ caseOpen = !caseOpen; manual = 'case'; manualAt = Date.now(); render(); };
    if (x) x.onclick = function(){ manual = 'calendar'; manualAt = Date.now(); caseOpen = false; render(); };
    var app = document.getElementById('app');
    app.onclick = function(e){
      if (document.body.className === 'is-night') { manual = 'calendar'; manualAt = Date.now(); render(); return; }
      var t = e.target, i = t.getAttribute && t.getAttribute('data-i');
      if (i !== null && i !== undefined && i !== '') { projSel = +i; manual = 'projects'; manualAt = Date.now(); render(); return; }
      if (t.id === 'projBack') { projSel = -1; manual = 'projects'; manualAt = Date.now(); render(); return; }
      if (t.id === 'pgNext') { projPage++; manual = 'projects'; manualAt = Date.now(); render(); return; }
      if (t.id === 'pgPrev') { projPage = Math.max(0, projPage-1); manual = 'projects'; manualAt = Date.now(); render(); return; }
    };
  }

  document.getElementById('nav').onclick = function(e){
    var v = e.target.getAttribute('data-v'); if (!v) return;
    if (v === 'photo' && manual === 'photo') photoIdx++;
    manual = v; manualAt = Date.now(); caseOpen = false; projSel = -1; render();
  };

  function get(url, cb){
    var x = new XMLHttpRequest();
    x.onreadystatechange = function(){ if (x.readyState===4 && x.status===200) { try { cb(JSON.parse(x.responseText)); } catch(e){} } };
    x.open('GET', url, true); x.send();
  }
  function applyData(j){
    if (LOCAL && window.LOCAL_PHOTOS) j.photos = window.LOCAL_PHOTOS;
    DATA = j; render();
  }
  function loadData(){
    get((LOCAL ? REMOTE : '') + 'data.json?t=' + Date.now(), function(j){
      try { localStorage.setItem('kdb', JSON.stringify(j)); } catch(e){}
      applyData(j);
    });
  }
  try { var c = localStorage.getItem('kdb'); if (c) applyData(JSON.parse(c)); } catch(e){}
  if (LOCAL && window.LOCAL_PHOTOS) { DATA.photos = window.LOCAL_PHOTOS; photoIdx = Math.floor(Math.random()*window.LOCAL_PHOTOS.length); }
  function loadWx(){
    get('https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON +
        '&current=temperature_2m,relative_humidity_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSingapore&forecast_days=3',
        function(j){ WX = j; render(); });
  }

  loadData(); loadWx(); render();
  setInterval(render, 30 * 1000);              // 时钟
  setInterval(loadData, 5 * 60 * 1000);       // 项目 / 案例 / 照片
  setInterval(loadWx, 30 * 60 * 1000);         // 天气
  setInterval(function(){ photoIdx++; }, 10 * 60 * 1000);
  setTimeout(function(){ location.reload(); }, 6 * 3600 * 1000); // 每 6 小时整页刷新一次，防止卡住
})();
</script>
</body>
</html>
